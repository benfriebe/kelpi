<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The client is a fixed application shell, not a document: no zoom-on-double-tap, and
         the safe-area insets matter on a phone attached over a tailnet.

         `interactive-widget=resizes-content` is C7, and it is an owner-directed phone rule
         (`chrome/form-factor.ts` says once that the whole phone program is a divergence from the
         shipped Swift app). Chrome 108 made `resizes-visual` the DEFAULT on Android: a software
         keyboard shrinks the visual viewport only, the layout viewport keeps its full height, and
         Chrome then SCROLLS the visual viewport to keep the focused element in view. In a shell
         that is `height: 100%` and `overflow: hidden` that scroll is the whole of the owner's
         round-5 report: the title bar and the pane header left the top of the screen, and the
         status footer - which lives below the panes, outside the layout viewport's visible part -
         surfaced between the key bar and the keyboard.

         `resizes-content` shrinks the LAYOUT viewport instead, so the app's 100% height IS the
         space above the keyboard: the title bar stays on screen, the pane's ResizeObserver sees
         the new height, and there is nothing left for the browser to scroll. Chrome 108+ and
         Firefox 132+ honour it; every other engine, iOS and iPadOS included, ignores an unknown
         viewport key, which is why `chrome/keyboard-viewport.ts` keeps the visual-viewport
         arithmetic and a scroll guard for the browsers that do not.

         MOBILE-PLAN.md section 7's C2 note said the opposite ("on Android the LAYOUT viewport
         also shrinks for a keyboard"). It was written before the device round and it had the
         default the wrong way round; the correction lives in `terminal/keyboard-inset.ts`. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Kelpi — terminal workspaces served by the kelpid daemon" />
    <!-- The Kelpi mark, printed from `@kelpi/core/icon` by the client's build (see
         vite.config.ts): the same drawing the Dock tile and the menu-bar glyph render, so a
         browser attached over a tailnet shows the app's own identity in its tab.

         Three declarations because browsers disagree. Safari renders no SVG favicon and never
         re-reads an icon that script swapped in, so the PNG is not a fallback there, it is the
         only icon an iPhone on the tailnet will ever show. `chrome/favicon.ts` replaces the
         href of BOTH icon links with a canvas-drawn badge of the same mark as agents change
         state; it needs at least one `link[rel~="icon"]` to exist. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Kelpi</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
