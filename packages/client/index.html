<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The client is a fixed application shell, not a document: no zoom-on-double-tap, and
         the safe-area insets matter on a phone attached over a tailnet. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Kelpi — terminal workspaces served by the kelpid daemon" />
    <!-- The Kelpi mark, printed from `@kelpi/core/icon` into `/favicon.svg` by the client's
         build (see vite.config.ts): the same drawing the Dock tile and the menu-bar glyph
         render, so a browser attached over a tailnet shows the app's own identity in its tab.
         `chrome/favicon.ts` then replaces this href with a canvas-drawn badge of the same mark
         as agents change state; it needs a `link[rel~="icon"]` to exist. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Kelpi</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
