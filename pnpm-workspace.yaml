packages:
  - packages/*

# `overrides` and `onlyBuiltDependencies` live HERE, not in the root package.json's `pnpm` field
# (#6). pnpm 11 stopped reading that field, and it drops it in silence: the override goes, so the
# client installs upstream `ghostty-web` instead of this repo's fork and every vendored fix in
# vendor/ghostty-web-patched/PROVENANCE.md disappears from the build with nothing failing; the
# build-script allowlist goes with it, so node-pty and electron arrive unbuilt.
#
# The two keys are not equally portable, and the difference matters to whoever upgrades pnpm.
# `overrides` is read from this file by pnpm 10 and 11 alike. `onlyBuiltDependencies` is a pnpm 10
# key that pnpm 11 removed outright, along with onlyBuiltDependenciesFile, neverBuiltDependencies,
# ignoredBuiltDependencies and ignoreDepScripts, in favour of `allowBuilds`. Moving it here did
# not make pnpm 11 honour it. What keeps an install on a pnpm that understands both keys, and on
# the generation of lockfile this repo carries, is `packageManager` in package.json.

# The vendored terminal engine, not npm's. `packages/client` asks for `ghostty-web@^0.4.0`; this
# resolves it to the patched fork whose bundle is tracked at vendor/ghostty-web-patched/dist.
overrides:
  ghostty-web: file:vendor/ghostty-web-patched

# Only these five may run install scripts. node-pty and electron are unusable without theirs.
# A pnpm 11 upgrade must convert this list into an `allowBuilds` map, which pnpm 11 reads instead:
#   allowBuilds:
#     electron: true
#     esbuild: true
#     fs-xattr: true
#     macos-alias: true
#     node-pty: true
onlyBuiltDependencies:
  - electron
  - esbuild
  - fs-xattr
  - macos-alias
  - node-pty
