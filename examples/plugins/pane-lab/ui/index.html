<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pane Lab</title><link rel="stylesheet" href="style.css"></head>
<body>
<!--
  No shell, no frame, no backdrop. This view is mounted as ONE frame over the whole pane grid and
  the host clips it to the header bands it is drawing, so everything below is absolutely positioned
  at the rectangle each pane's frame carries. Anything drawn outside those rectangles is clipped
  away by the host and never reaches the screen or the pointer.

  Every `data-testid` is set while a header is actually being drawn and goes with it, so the
  presence of `lab-pane-header` is the signal that this presenter is painting that pane.
-->
<div id="root" class="root" hidden></div>
<p id="error" class="error" role="alert" hidden></p>
<script type="module" src="pane-chrome.js"></script>
</body></html>
